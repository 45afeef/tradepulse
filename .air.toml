root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", ".git"]
  delay = 300
  # Docker Desktop on Windows/macOS does not forward file-change events into
  # containers, so poll for changes (works everywhere).
  poll = true
  poll_interval = 500
