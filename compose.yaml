# Development, identical on Windows / macOS / Linux. Only Docker is required.
#   docker compose up --build              dev server + hot reload -> http://localhost:8080/docs
#   docker compose run --rm check          vet + race tests
#   docker compose run --rm test           tests only
#   docker compose run --rm openapi        regenerate openapi.json
#   docker compose run --rm tidy           resolve deps / update go.sum
x-go: &go
  image: tradepulse-dev          # one image shared by every service below
  build:
    context: .
    dockerfile: Dockerfile.dev
  working_dir: /app
  volumes:
    - .:/app
    - gomod:/go/pkg/mod          # dependency cache
    - gobuild:/root/.cache/go-build

services:
  api:
    <<: *go
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      DOCS_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-0123456789abcdef0123}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      SIM_DEMO: market
      # DEV ONLY first admin (idempotent). Production: set via Secret Manager, remove after first start.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-dev-admin-password-change-me}
      LOG_LEVEL: debug

  # --- one-shot tools (not started by `up`) ---
  check:
    <<: *go
    profiles: [tools]
    command: sh -c "go mod tidy && go vet ./... && go test -race ./..."
  test:
    <<: *go
    profiles: [tools]
    command: go test -race ./...
  openapi:
    <<: *go
    profiles: [tools]
    command: sh -c "go mod tidy && go run ./cmd/openapi > openapi.json"
  tidy:
    <<: *go
    profiles: [tools]
    command: go mod tidy

volumes:
  gomod:
  gobuild:
