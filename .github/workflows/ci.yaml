name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradepulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tradepulse"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tradepulse?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: OpenAPI spec is up to date
        run: |
          go run ./cmd/openapi > /tmp/openapi.json
          diff -u openapi.json /tmp/openapi.json

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: govulncheck (known vulnerabilities in dependencies that the code actually reaches)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gosec (static security analysis; advisory until the first clean baseline)
        uses: securego/gosec@master
        continue-on-error: true
        with:
          args: -no-fail ./...
      - name: Build image
        run: docker build -t tradepulse:ci .
      - name: Trivy image scan (advisory)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: tradepulse:ci
          severity: HIGH,CRITICAL
          exit-code: "0"
