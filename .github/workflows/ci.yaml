name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradepulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tradepulse"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tradepulse?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: OpenAPI spec is up to date
        run: |
          go run ./cmd/openapi > /tmp/openapi.json
          diff -u openapi.json /tmp/openapi.json
